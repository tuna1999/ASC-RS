[package]
name = "asc-gui"
description = "eframe/egui desktop UI for ASC-RS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
asc-core.workspace = true
asc-dex.workspace = true
asc-manifest.workspace = true
asc-apk.workspace = true
asc-query.workspace = true
thiserror.workspace = true
# eframe pulls in winit + wgpu + accesskit + egui. Pinned locally per
# Lead's standing approval (do NOT move into [workspace.dependencies]).
# `accesskit` MUST stay on the main feature list (not just dev-deps):
# it transitively enables `accesskit_winit` whose `default` feature pulls
# in `winit/x11` and `winit/wayland`. Without it, release builds hit
# winit's "platform not supported" compile_error on Linux.
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
# parking_lot gives us a non-poisoning Mutex/RwLock — preferred over
# std::sync::Mutex in the GUI's hot path (see CLAUDE rule rs-parking-lot).
parking_lot = "0.12"
# Native file dialogs (File ▸ Open…, Ctrl+O).
rfd = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu"] }
# Re-enable eframe's accesskit plumbing so egui-winit's PlatformOutput
# pattern matches the (kittest-enabled) egui build in tests.
eframe = { version = "0.33", features = ["accesskit"] }

[build-dependencies]
# Embed the app icon + version resource into the Windows executable.
winresource = "0.1"

[[bin]]
name = "asc-gui"
path = "src/main.rs"
