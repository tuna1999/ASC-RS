[package]
name = "asc-apk"
description = "Read-only mmap APK/ZIP engine for ASC-RS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
flate2.workspace = true
crc32fast.workspace = true

[dev-dependencies]
# Tests build ZIP archives in a temp file and let Apk::open mmap them.
# Declared as a crate-local dev-dep so we don't touch the workspace root.
tempfile = "3"