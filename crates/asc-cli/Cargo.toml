[package]
name = "asc-cli"
description = "CLI frontend for ASC-RS (getclass/findrefs parity)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "asc-rs"
path = "src/main.rs"

[dependencies]
asc-apk.workspace = true
asc-core.workspace = true
asc-manifest.workspace = true
asc-query.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
asc-dex.workspace = true
# The APK fixtures share asc-core's test ZIP writer
# (tests/common/zipw.rs) instead of the vulnerable `zip` 0.6 crate
# (RUSTSEC-2026-0367/0368/0369); flate2/crc32fast are already in the
# production graph.
flate2.workspace = true
crc32fast.workspace = true
