# cargo-deny policy — run by .github/workflows/deny.yml (and locally: `cargo deny check`).
#
# Scope: this is a *policy* gate over the dependency graph (advisories,
# licenses, sources, duplicates), not a build gate. It needs the network
# (RustSec advisory DB, crates.io index), so it lives in its own workflow
# and never blocks the per-commit CI gates.
#
# Lint levels are deliberately not all "deny": the goal is to catch a real
# advisory / a copyleft-or-unknown license / a non-crates.io source, not to
# freeze the graph. Duplicate versions and wildcards are reported, not
# failed, so a routine dependency bump cannot turn CI red for no reason.

[advisories]
# Report unmaintained crates only when we depend on them directly (the
# workspace members); the transitive tree is far too noisy.
unmaintained = "workspace"
unsound = "all"
# Findings that cannot be fixed by a dependency bump go here, one entry
# per crate with a reason, e.g.:
#   { id = "RUSTSEC-0000-0000", reason = "…" }
ignore = []

[bans]
# Duplicate versions are a report, not a failure (the tree has several
# legitimate duplicates via the egui/windows stacks).
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
# Every license family present in the locked graph, minus the copyleft
# arms of dual licenses (r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later",
# self_cell is "Apache-2.0 OR GPL-2.0-only" — the permissive arm is taken).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
