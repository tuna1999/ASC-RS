name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Required for workflow_dispatch.'
        required: true

# Refuse to run two release builds in parallel — they would clobber the GitHub
# release assets and waste a matrix slot.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Least privilege: only `publish` needs to write (it creates the GitHub
# release). The gates/binaries/source-archive jobs just read the repository
# and hand files to `publish` through the job runtime token, so the
# workflow default is `contents: read` and `publish` opts in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tag push: the pushed tag. Manual dispatch: the `tag` input (ref_name
  # would be the branch name there).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build artefacts from the TAG's commit, never from whatever ref
          # the workflow happened to be dispatched on: a manual
          # workflow_dispatch from a branch would otherwise publish branch
          # HEAD under the tag's name (the version string alone does not
          # prove the commit). The ref is namespace-qualified because a
          # BRANCH named `vX.Y.Z` satisfies a bare short name — both for
          # `git rev-parse` and for actions/checkout's own lookup.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the checkout is the release tag's commit
        shell: bash
        run: bash scripts/verify_release_tag.sh "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Reproducible release: pin the exact compiler instead of the
          # moving `stable` ref, so a released binary is a function of the
          # tag, not of the day the tag was pushed. 1.97.1 is the version
          # the full local gate suite (fmt/clippy/test/release build) is
          # verified with; CI's `stable` lane may be newer.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers  # lavapipe: CPU wgpu adapter for egui_kittest render tests

      - name: Download corpus APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus/apk corpus/dex
          curl -fL -A 'curl/8' -o corpus/apk/com.aurora.store_60.apk \
            https://f-droid.org/repo/com.aurora.store_60.apk
          curl -fL -A 'curl/8' -o corpus/apk/org.fdroid.fdroid_1016000.apk \
            https://f-droid.org/repo/org.fdroid.fdroid_1016000.apk

      - name: Build workload.apk from frozen oracle
        shell: bash
        env:
          WORKLOAD_SRC: ${{ runner.temp }}/oracle
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/MG1937/asc.git "$WORKLOAD_SRC"
          git -C "$WORKLOAD_SRC" checkout --quiet ccc6bae7704f5c5ef1a7271e27314837079621fb
          WORKLOAD_SRC="$WORKLOAD_SRC" python3 - <<'PY'
          import os, zipfile, pathlib
          src = pathlib.Path(os.environ['WORKLOAD_SRC']) / 'tests/fixtures/reference-workload.zip'
          dex = zipfile.ZipFile(src).read('classes.dex')
          out_apk = pathlib.Path('corpus/apk/workload.apk')
          out_dex = pathlib.Path('corpus/dex/workload_classes.dex')
          with zipfile.ZipFile(out_apk, 'w', compression=zipfile.ZIP_STORED) as z:
              z.writestr('classes.dex', dex)
          out_dex.write_bytes(dex)
          print(f'workload.apk={out_apk.stat().st_size} dex={len(dex)}')
          PY

      - name: Extract DEX fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          for apk, prefix in [
              ('corpus/apk/com.aurora.store_60.apk', 'aurora'),
              ('corpus/apk/org.fdroid.fdroid_1016000.apk', 'fdroid'),
          ]:
              with zipfile.ZipFile(apk) as z:
                  for n in [x for x in z.namelist() if x.endswith('.dex')]:
                      data = z.read(n)
                      out = f'corpus/dex/{prefix}_{n}'
                      with open(out, 'wb') as f:
                          f.write(data)
          PY

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        env:
          # The corpus is recreated above; a fixture listed here that is
          # still missing must FAIL rather than silently skip
          # (docs/CORPUS.md).
          ASC_REQUIRE_CORPUS: aurora,fdroid,workload
          # The render/glyph assertions self-skip without this; the Linux
          # leg installs lavapipe precisely to support them.
          ASC_GUI_SHOTS: "1"
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release

      - name: Selfcheck
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/asc-gui${{ runner.os == 'Windows' && '.exe' || '' }} \
            --selfcheck corpus/apk/workload.apk

      - name: Differential parity
        shell: bash
        run: |
          set -euo pipefail
          python tests/differential/run_differential.py \
            target/release/asc-rs${{ runner.os == 'Windows' && '.exe' || '' }}

  binaries:
    name: binaries (${{ matrix.label }})
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            bin_prefix: ''
            artifact: asc-rs-linux-x64
          - os: windows-2022
            label: windows-x64
            bin_prefix: '.exe'
            artifact: asc-rs-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same source-of-truth rule as `gates`: the published binaries
          # must be a function of the tag's commit.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the checkout is the release tag's commit
        shell: bash
        run: bash scripts/verify_release_tag.sh "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Same pinned compiler as `gates`: these two jobs produce the
          # published binaries, so they must agree.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: Build (release)
        run: cargo build --release

      - name: Strip + zip binaries
        shell: bash
        env:
          BIN_PREFIX: ${{ matrix.bin_prefix }}
          ARTIFACT: ${{ matrix.artifact }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          BIN_DIR="target/release"
          mkdir -p dist
          cp "$BIN_DIR/asc-rs${BIN_PREFIX}" dist/
          cp "$BIN_DIR/asc-gui${BIN_PREFIX}" dist/
          if [ "$RUNNER_OS" = "Linux" ]; then
            strip dist/asc-rs dist/asc-gui
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # git-bash on Windows runners doesn't ship `zip`; use PowerShell.
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Force -CompressionLevel Optimal \
               -Path 'asc-rs${BIN_PREFIX}','asc-gui${BIN_PREFIX}' \
               -DestinationPath '..\\${ARTIFACT}.zip'"
          else
            zip -9 "../${ARTIFACT}.zip" asc-rs${BIN_PREFIX} asc-gui${BIN_PREFIX}
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  source-archive:
    name: source archive
    needs: gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The source ZIP must be the tag's tree, not the dispatching ref.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the checkout is the release tag's commit
        shell: bash
        run: bash scripts/verify_release_tag.sh "$RELEASE_TAG"

      - name: Build byte-reproducible source ZIP
        shell: bash
        run: |
          set -euo pipefail
          # scripts/build_release.py derives its file list from `git ls-files`,
          # so this also acts as a sanity check that every file we'd ship is
          # actually tracked.
          mkdir -p dist
          python scripts/build_release.py "$RELEASE_TAG" --output dist

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: |
            dist/*-source.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: [binaries, source-archive]
    runs-on: ubuntu-22.04
    # The one job that needs to write: it creates the GitHub release and
    # attaches the artifacts. Everything else in this workflow is read-only.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f | sort

      - name: Compute combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          for f in $(find . -type f \( -name '*.zip' -o -name '*.exe' \) | sort); do
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
