name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: every job here only reads the repository (checkout) and
# uploads build artifacts through the job's runtime token, so `contents:
# read` is the whole requirement. Granting more per-job is done inline, and
# only where a job truly needs it (no job here does).
permissions:
  contents: read

jobs:
  lint-build-test:
    name: lint + build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: asc-rs-linux-x64
          - os: windows-2022
            artifact: asc-rs-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Reference oracle lives at reference/asc/ but is gitignored.
          # Golden fixtures are committed; corpus APKs are downloaded below.
          fetch-depth: 0

      - name: Install Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # This lane deliberately tracks the LATEST stable, so a new
          # compiler/clippy lint shows up here instead of in a release.
          # The MSRV floor (workspace `rust-version`) is covered by the
          # `msrv` job below; releases pin their own toolchain.
          #
          # `toolchain` is set explicitly because the action's ref is a
          # commit SHA, which the action cannot read a version from.
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers  # lavapipe: CPU wgpu adapter for egui_kittest render tests

      - name: Download corpus APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus/apk corpus/dex
          curl -fL -A 'curl/8' -o corpus/apk/com.aurora.store_60.apk \
            https://f-droid.org/repo/com.aurora.store_60.apk
          curl -fL -A 'curl/8' -o corpus/apk/org.fdroid.fdroid_1016000.apk \
            https://f-droid.org/repo/org.fdroid.fdroid_1016000.apk

      - name: Build workload.apk from frozen oracle
        # workload.apk is a deterministic synthetic ZIP that wraps the
        # classes.dex extracted from MG1937/asc @ ccc6bae (oracle freeze).
        # See docs/CORPUS.md and reference/FREEZE.md.
        shell: bash
        env:
          WORKLOAD_SRC: ${{ runner.temp }}/oracle
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/MG1937/asc.git "$WORKLOAD_SRC"
          git -C "$WORKLOAD_SRC" checkout --quiet ccc6bae7704f5c5ef1a7271e27314837079621fb
          WORKLOAD_SRC="$WORKLOAD_SRC" python3 - <<'PY'
          import os, zipfile, pathlib
          src = pathlib.Path(os.environ['WORKLOAD_SRC']) / 'tests/fixtures/reference-workload.zip'
          dex = zipfile.ZipFile(src).read('classes.dex')
          out_apk = pathlib.Path('corpus/apk/workload.apk')
          out_dex = pathlib.Path('corpus/dex/workload_classes.dex')
          with zipfile.ZipFile(out_apk, 'w', compression=zipfile.ZIP_STORED) as z:
              z.writestr('classes.dex', dex)
          out_dex.write_bytes(dex)
          print(f'workload.apk={out_apk.stat().st_size} dex={len(dex)}')
          PY
          ls -la corpus/apk

      - name: Extract DEX fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          for apk, prefix in [
              ('corpus/apk/com.aurora.store_60.apk', 'aurora'),
              ('corpus/apk/org.fdroid.fdroid_1016000.apk', 'fdroid'),
          ]:
              with zipfile.ZipFile(apk) as z:
                  for n in [x for x in z.namelist() if x.endswith('.dex')]:
                      data = z.read(n)
                      out = f'corpus/dex/{prefix}_{n}'
                      with open(out, 'wb') as f:
                          f.write(data)
                      print(out, len(data))
          PY

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (debug)
        env:
          # CI recreated these fixtures above; a test that cannot find
          # one must FAIL, not silently skip (docs/CORPUS.md).
          ASC_REQUIRE_CORPUS: aurora,fdroid,workload
          # Enable the render/glyph assertions, which self-skip without
          # this. The Linux leg installs lavapipe for exactly these
          # tests; without the variable that dependency buys nothing.
          ASC_GUI_SHOTS: "1"
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release

      - name: Selfcheck
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/asc-gui${{ runner.os == 'Windows' && '.exe' || '' }} \
            --selfcheck corpus/apk/workload.apk

      - name: Differential parity (golden fixtures)
        shell: bash
        run: |
          set -euo pipefail
          python tests/differential/run_differential.py \
            target/release/asc-rs${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: perf_compare selftest
        shell: bash
        run: python benches/perf_compare.py --selftest

      - name: Upload release binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/asc-rs${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/asc-gui${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  fuzz:
    name: fuzz (parsers engaged, smoke + regression)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Explicit because the action's ref is a SHA (see the other lane).
          toolchain: stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
          cache-on-failure: true

      - name: Registry tests with every engine feature on
        # The registry tests assert each contract target is NOT
        # SkippedDisabled when its feature is enabled and actually
        # invokes the parser, so a green build proves coverage.
        run: cargo test --manifest-path fuzz/Cargo.toml --features all

      - name: Smoke every target (short budget, all features)
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo build --release --bin fuzz-runner --features all
          TARGETS=$(./target/release/fuzz-runner --list | awk 'NR>1 {print $1}' | grep -v '^dummy$')
          echo "targets: $TARGETS"
          for t in $TARGETS; do
            echo "=== fuzz smoke: $t ==="
            ./run.sh "$t" 10 all
          done

      - name: Replay committed crash regressions
        # `regress/` holds committed fixtures named
        # `<target>-<fnv1a>.bin`; the runner replays only the files
        # matching --target (SKIP + exit 0 when a target has none,
        # exit 2/3/abort on unreadable fixture, disabled parser, or
        # a firing regression). New crashes still land in crashes/.
        working-directory: fuzz
        run: |
          set -euo pipefail
          TARGETS=$(./target/release/fuzz-runner --list | awk 'NR>1 {print $1}' | grep -v '^dummy$')
          for t in $TARGETS; do
            echo "=== fuzz regress: $t ==="
            ./target/release/fuzz-runner --target "$t" --regress regress
          done
          # Every committed fixture must belong to a known target;
          # otherwise it silently rots un-replayed.
          shopt -s nullglob
          for f in regress/*.bin; do
            ft=$(basename "$f" | cut -d- -f1)
            if ! printf '%s\n' $TARGETS | grep -qx "$ft"; then
              echo "regress fixture $f does not match any target" >&2
              exit 2
            fi
          done

  # The `lint-build-test` lane above runs on whatever `stable` is today, so
  # a genuine MSRV break (a dependency or a stdlib/edition feature newer than
  # the workspace's `rust-version`) can only be discovered by a user. This
  # lane pins the declared floor and compiles the whole workspace with it.
  #
  # `cargo check --all-targets` (not the test suite) is deliberate: the
  # question is "does this still build on the oldest supported compiler",
  # which needs no corpus, GPU or release build, and the full behavioural
  # coverage already runs on both stable legs.
  msrv:
    name: msrv (pinned, rust-version floor)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Keep in lockstep with `[workspace.package] rust-version`
          # (1.95: the egui 0.36 stack requires it — `cargo metadata
          # --format-version 1` reports `rust_version` 1.95 for
          # eframe/egui/epaint/…).
          toolchain: "1.95.0"

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: cargo check (workspace, all targets/features)
        run: cargo check --workspace --all-targets --all-features
